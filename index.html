<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio Ranggadya Aditama Ramadhani — Software Engineer & Full-Stack Developer." />
    <title>Ranggadya - Software Engineer &amp; Full-Stack Developer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Terapkan tema sebelum paint agar tidak flicker (Default: Light) -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        // Default mutlak adalah light. Hanya aktifkan dark jika user sudah sengaja memilih 'dark'.
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
