<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap"

      Critical first-paint gate. It prevents the app from appearing before

      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #080d19;
    }

<body>
  <div id="initial-welcome-gate" aria-hidden="true"></div>
